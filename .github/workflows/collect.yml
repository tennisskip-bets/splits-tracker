name: Collect splits
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python splits_tracker.py once
      - run: python build_page.py
      - name: Save results
        run: |
          git config user.name "splits-bot"
          git config user.email "splits-bot@users.noreply.github.com"
          git add splits_log.csv docs/index.html
          git diff --cached --quiet || (git commit -m "snapshot $(date -u +%FT%TZ)" && git pull --rebase && git push)
